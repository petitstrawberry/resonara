[package]
name = "resonara-gain"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clap-sys = { path = "vendor/clap-sys", version = "=0.5.0" }

[dev-dependencies]
clap-sys-upstream = { package = "clap-sys", version = "=0.5.0" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
debug = 0

[workspace]
