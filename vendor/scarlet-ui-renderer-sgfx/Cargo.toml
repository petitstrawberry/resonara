[package]
name = "scarlet-ui-renderer-sgfx"
version = "1.0.0"
edition = "2024"

[features]
default = ["std"]
legacy-scarlet-std = [
    "scarlet-ui-core/legacy-scarlet-std",
]
std = [
    "scarlet-ui-core/std",
    "sgfx/std",
]

[dependencies]
libm = { version = "0.2", default-features = false }
scarlet-ui-core = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "91238ed12c3379c0aea7e7ba86e73139cfb1f550", default-features = false }
sgfx = { git = "https://github.com/petitstrawberry/sgfx", rev = "5ea41a0dfd6992bb1c0fce06c8e65425dc978140", package = "sgfx-core", default-features = false }

[lib]
name = "scarlet_ui_renderer_sgfx"
path = "src/lib.rs"
