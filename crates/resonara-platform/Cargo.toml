[package]
name = "resonara-platform"
version = "0.1.0"
edition = "2024"
[dependencies]
resonara-core = { path = "../resonara-core" }
[target.'cfg(not(target_os = "scarlet"))'.dependencies]
cpal = "0.15.3"

[target.'cfg(target_os = "scarlet")'.dependencies]
sas-client = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", default-features = false, features = ["std"] }
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", default-features = false, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("scarlet"))'] }
